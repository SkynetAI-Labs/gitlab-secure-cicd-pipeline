[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-release-gate"
version = "0.1.0"
description = "A small release-risk API used to demonstrate gated GitLab delivery"
requires-python = ">=3.14"
dependencies = ["Flask>=3.1.3,<4", "gunicorn>=23,<26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --cov=release_gate --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=95 --junitxml=reports/junit.xml"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
